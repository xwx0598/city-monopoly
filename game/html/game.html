<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城市大富翁</title>
<link rel="stylesheet" href="../css/game.css?v=20261102d">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="badge"><svg class="ico" data-ic="tower" viewBox="-32 -32 64 64" style="width:22px;height:22px"></svg></div>
      <div>
        <h1>城市大富翁</h1>
        <small id="modeLabel">单机 vs AI</small>
      </div>
    </div>
    <div class="actions">
      <a class="btn-ghost" href="../../lobby/html/index.html">🏠 返回大厅</a>
      <button class="btn-ghost" id="statsBtn">📊 统计</button>
      <button class="btn-ghost" id="newGameBtn">🔄 新对局</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div id="boardWrap">
        <div id="board">
          <div class="strip" id="rowTop"></div>
          <div class="strip" id="colRight"></div>
          <div class="strip" id="rowBottom"></div>
          <div class="strip" id="colLeft"></div>          <div id="tokenLayer"></div>
          <div id="center">
            <div class="center-title">城 市 大 富 翁</div>
            <div id="diceArea">
              <div class="die" id="die1"></div>
              <div class="die" id="die2"></div>
            </div>
            <div id="turnInfo">轮到你行动</div>
            <button id="rollBtn" class="btn-main">掷骰子</button>
            <div style="display:flex;gap:6px;transform-style:preserve-3d">
              <button id="buildBtn" class="btn-build" style="flex:1">🏗️ 建设房屋</button>
              <button id="tradeBtn" class="btn-build" style="flex:1">🤝 交易</button>
            </div>
            <div id="roundInfo">第 1 / 30 回合</div>
          </div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div id="playersBar"></div>
      <div class="panel">
        <h4>行动日志</h4>
        <div id="log"></div>
      </div>
    </aside>
  </main>
</div>

<div class="overlay hidden" id="buyModal">
  <div class="modal">
    <h3 id="buyTitle">购买地产？</h3>
    <p id="buyDesc"></p>
    <div class="btns">
      <button class="btn-yes" id="buyYes">买下它</button>
      <button class="btn-no" id="buyNo">放弃</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="cardModal">
  <div class="modal" id="cardBox">
    <div class="card-icon"><svg class="ico" data-ic="card" viewBox="-32 -32 64 64" style="width:52px;height:52px"></svg></div>
    <h3>机会卡</h3>
    <p id="cardDesc"></p>
    <div class="btns"><button class="btn-yes" id="cardOk">好的</button></div>
  </div>
</div>

<div class="overlay hidden" id="noticeModal">
  <div class="modal" id="noticeBox">
    <h3 id="noticeTitle">提示</h3>
    <p id="noticeDesc"></p>
    <div class="btns"><button class="btn-yes" id="noticeOk">知道了</button></div>
  </div>
</div>

<div class="overlay hidden" id="debtModal">
  <div class="modal">
    <h3>💸 资不抵债！</h3>
    <p id="debtDesc"></p>
    <div class="btns">
      <button class="btn-yes" id="debtSell">🏗️ 变卖资产凑钱</button>
      <button class="btn-no" id="debtBust">🚫 宣告破产</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="jailModal">
  <div class="modal">
    <h3 id="jailTitle">⛓️ 你在监狱中</h3>
    <p id="jailDesc"></p>
    <div class="btns">
      <button class="btn-yes" id="jailBail">💰 保释出狱（¥50）</button>
      <button class="btn-no" id="jailRoll">🎲 掷骰碰双数</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="auctionModal">
  <div class="modal">
    <h3 id="aucTitle">🔨 拍卖</h3>
    <p id="aucInfo"></p>
    <p style="font-weight:700;margin-bottom:8px" id="aucCur"></p>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn-yes" id="aucB10">出价</button>
      <button class="btn-yes" id="aucB50">加价 ¥50</button>
      <button class="btn-yes" id="aucB100">加价 ¥100</button>
      <button class="btn-no" id="aucPass">弃拍</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="tradeModal">
  <div class="modal" style="width:min(480px,94vw)">
    <h3 id="tradeTitle">🤝 玩家交易</h3>
    <div id="tradeBody"></div>
    <div class="btns" style="margin-top:14px" id="tradeBtns"></div>
  </div>
</div>

<div class="overlay hidden" id="buildModal">
  <div class="modal" style="width:min(420px,94vw)">
    <h3>🏗️ 资产管理</h3>
    <p style="margin-bottom:8px">均衡建设：同组地块须一起加盖（1-1-1 → 2-2-2 → 3-3-3）。缺钱时优先<b>抵押</b>（套现地价 50%，赎回加 10% 利息；抵押中免收租），也可卖房（每级退 25% 地价）或半价卖地。</p>
    <p style="margin-bottom:8px;font-size:13px;font-weight:600" id="modalCash"></p>
    <div id="buildList"></div>
    <div class="btns" style="margin-top:16px"><button class="btn-no" id="buildClose">完成</button></div>
  </div>
</div>

<div class="overlay hidden" id="statsModal">
  <div class="modal" style="width:min(560px,94vw)">
    <h3>📊 对局统计</h3>
    <div id="statsBody"></div>
    <div class="btns" style="margin-top:14px"><button class="btn-no" id="statsClose">关闭</button></div>
  </div>
</div>

<div class="overlay hidden" id="resumeModal">
  <div class="modal">
    <h3>📂 发现未完成的对局</h3>
    <p id="resumeDesc"></p>
    <div class="btns">
      <button class="btn-yes" id="resumeYes">继续对局</button>
      <button class="btn-no" id="resumeNo">重新开始</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="gameOverModal">
  <div class="modal">
    <h3 id="goTitle">游戏结束</h3>
    <p id="goDesc"></p>
    <div class="btns"><button class="btn-yes" id="restartBtn">再来一局</button></div>
  </div>
</div>


<!-- ============ 模块化脚本：核心引擎 + 可插拔玩法模块 ============ -->
<script src="../js/icons.js?v=20261102a"></script>
<script src="../js/config.js?v=20261102a"></script>
<script src="../js/core.js?v=20261102f"></script>
<script src="../js/modules/m-maps.js?v=20261102a"></script>
<script src="../js/modules/m-special.js?v=20261102e"></script>
<script src="../js/modules/m-chance.js?v=20261102e"></script>
<script src="../js/modules/m-combos.js?v=20261102a"></script>
<script src="../js/modules/m-ai-diff.js?v=20261102a"></script>
<script src="../js/modules/m-trade.js?v=20261102e"></script>
<script src="../js/modules/m-extra-tiles.js?v=20261102a"></script>
<script src="../js/modules/m-stats.js?v=20261102e"></script>
<script src="../js/modules/m-synergy.js?v=20261102d"></script>
<script src="../js/boot.js?v=20261102g"></script>
</body>
</html>
